<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplong NexGen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1e40af;--blue-600:#2563eb;--blue-500:#3b82f6;--blue-100:#dbeafe;--blue-50:#eff6ff;--green:#059669;--green-100:#d1fae5;--green-50:#ecfdf5;--orange:#d97706;--orange-100:#fef3c7;--red:#dc2626;--red-100:#fee2e2;--purple:#7c3aed;--purple-100:#ede9fe;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
--bg-main:var(--gray-50);--bg-card:#fff;--bg-sidebar:var(--gray-900);--bg-topbar:#fff;--text-primary:var(--gray-900);--text-secondary:var(--gray-500);--border-color:var(--gray-200);--table-hover:var(--blue-50);--topbar-border:var(--gray-200)}

[data-theme="dark"]{--bg-main:#0f172a;--bg-card:#1e293b;--bg-sidebar:#0c1222;--bg-topbar:#1e293b;--text-primary:#e2e8f0;--text-secondary:#94a3b8;--border-color:#334155;--table-hover:#1e3a5f;--topbar-border:#334155;--gray-50:#1e293b;--gray-100:#334155;--gray-200:#475569;--gray-300:#64748b;--gray-400:#94a3b8;--gray-500:#94a3b8;--gray-600:#cbd5e1;--gray-700:#e2e8f0;--gray-800:#f1f5f9;--gray-900:#f8fafc}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg-main);color:var(--text-primary);overflow:hidden;height:100vh}
.login-page{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#1e3a8a 0%,#312e81 100%)}
.login-card{background:#fff;border-radius:16px;padding:48px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-card h1{font-size:1.8rem;font-weight:800;color:var(--blue);margin-bottom:4px}
.login-card p{color:#6b7280;margin-bottom:32px;font-size:.9rem}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:#374151;margin-bottom:6px}
.form-group input{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;outline:none;transition:border .15s}
.form-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff;width:100%;justify-content:center;padding:12px}
.btn-primary:hover{background:var(--blue-600)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-outline{background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary)}
.btn-outline:hover{background:var(--gray-50);border-color:var(--gray-400)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}

.app-layout{display:flex;height:100vh}
.sidebar{width:240px;background:var(--bg-sidebar);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s ease;z-index:100}
.sidebar-logo{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo h2{font-size:1.2rem;font-weight:800}
.sidebar-logo h2 span{color:#93c5fd}
.sidebar-logo .subtitle{font-size:.7rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-section{margin-bottom:16px}
.nav-section-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;padding:8px 12px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.875rem;color:#9ca3af;transition:all .12s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e5e7eb}
.nav-item.active{background:var(--blue);color:#fff;font-weight:500}
.nav-item .icon{width:18px;text-align:center;font-size:.9rem}
.nav-item .badge-count{margin-left:auto;background:var(--red);color:#fff;font-size:.65rem;padding:1px 6px;border-radius:999px;font-weight:700}

.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--bg-topbar);border-bottom:1px solid var(--topbar-border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left h2{font-size:1.1rem;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-search{padding:7px 14px;border:1px solid var(--border-color);border-radius:8px;width:240px;font-size:.85rem;outline:none;background:var(--bg-main);color:var(--text-primary)}
.topbar-search:focus{border-color:var(--blue-500);background:var(--bg-card)}
.notif-btn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.notif-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--bg-topbar)}
.lang-select{padding:6px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:.8rem;background:var(--bg-card);color:var(--text-primary);cursor:pointer}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.theme-toggle{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s}
.theme-toggle:hover{background:var(--gray-100)}
.hamburger{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-card);cursor:pointer;align-items:center;justify-content:center;font-size:1.2rem}

.content{flex:1;overflow-y:auto;padding:24px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px}
.stat-card .stat-label{font-size:.8rem;color:var(--text-secondary);margin-bottom:4px}
.stat-card .stat-value{font-size:1.8rem;font-weight:800;color:var(--text-primary)}
.stat-card .stat-change{font-size:.8rem;margin-top:4px;display:flex;align-items:center;gap:4px}
.stat-card .stat-change.up{color:var(--green)}
.stat-card .stat-change.down{color:var(--red)}

.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;overflow:hidden;margin-bottom:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:1rem;font-weight:700}
.card-body{padding:0}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);font-weight:600;background:var(--bg-main);border-bottom:1px solid var(--border-color)}
td{padding:12px 16px;border-bottom:1px solid var(--border-color);font-size:.875rem}
tr:hover td{background:var(--table-hover)}
tr:last-child td{border-bottom:none}
tr.clickable-row{cursor:pointer}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:600}
.badge-green{background:var(--green-100);color:var(--green)}
.badge-blue{background:var(--blue-100);color:var(--blue)}
.badge-orange{background:var(--orange-100);color:var(--orange)}
.badge-red{background:var(--red-100);color:var(--red)}
.badge-purple{background:var(--purple-100);color:var(--purple)}
.badge-gray{background:var(--gray-100);color:var(--gray-600)}

.chart-container{padding:20px}
.chart-bar-group{display:flex;align-items:flex-end;gap:8px;height:180px;padding:0 4px;margin-bottom:8px}
.chart-bar{flex:1;border-radius:4px 4px 0 0;min-width:20px;position:relative;transition:all .4s cubic-bezier(.4,0,.2,1);cursor:pointer;opacity:.85}
.chart-bar:hover{opacity:1;transform:scaleY(1.02);transform-origin:bottom}
.chart-bar .tooltip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--gray-800);color:#fff;padding:6px 12px;border-radius:6px;font-size:.75rem;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:10}
.chart-bar .tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--gray-800)}
.chart-bar:hover .tooltip{display:block;animation:fadeIn .15s ease}
.chart-labels{display:flex;gap:8px}
.chart-labels span{flex:1;text-align:center;font-size:.7rem;color:var(--text-secondary)}

@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes growUp{from{height:0}to{height:var(--target-height)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border-color);padding:0 20px}
.tab{padding:10px 16px;font-size:.85rem;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

.entity-chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.entity-chip{padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:500;cursor:pointer;border:1px solid var(--border-color);background:var(--bg-card);transition:all .12s;color:var(--text-primary)}
.entity-chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .2s ease}
.modal{background:var(--bg-card);border-radius:16px;padding:32px;width:600px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideDown .25s ease}
.modal h3{font-size:1.2rem;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-100);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--gray-200)}

.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.detail-item .detail-label{font-size:.75rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.detail-item .detail-value{font-size:.95rem;font-weight:600}

.timeline{padding:20px}
.timeline-item{display:flex;gap:16px;padding-bottom:20px;position:relative}
.timeline-item:not(:last-child)::after{content:'';position:absolute;left:11px;top:28px;bottom:0;width:2px;background:var(--border-color)}
.timeline-dot{width:24px;height:24px;border-radius:50%;background:var(--blue-100);border:2px solid var(--blue-500);flex-shrink:0;z-index:1}
.timeline-dot.completed{background:var(--green);border-color:var(--green)}
.timeline-content h4{font-size:.85rem;font-weight:600}
.timeline-content p{font-size:.8rem;color:var(--text-secondary)}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.empty-state p{font-size:.95rem}

.kpi-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.kpi-pill{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:12px 20px;flex:1;text-align:center;min-width:120px}
.kpi-pill .kpi-val{font-size:1.4rem;font-weight:800;color:var(--text-primary)}
.kpi-pill .kpi-label{font-size:.75rem;color:var(--text-secondary);margin-top:2px}

.progress-bar{height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.fill-green{background:var(--green)}
.fill-blue{background:var(--blue-500)}
.fill-orange{background:var(--orange)}
.fill-red{background:var(--red)}

.actions-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── Company Profile ── */
.company-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.company-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px;cursor:pointer;transition:all .15s}
.company-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px)}
.company-card .cc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.company-card .cc-name{font-weight:700;font-size:1rem}
.company-card .cc-country{font-size:.8rem;color:var(--text-secondary)}
.company-card .cc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.company-card .cc-stat{font-size:.8rem}
.company-card .cc-stat .val{font-weight:700;font-size:.95rem}
.company-card .cc-stat .lbl{color:var(--text-secondary)}
/* ── CRM Filter Bar ── */
.crm-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.crm-filter-input{padding:7px 14px;border:1px solid var(--border-color);border-radius:8px;font-size:.85rem;background:var(--bg-card);color:var(--text-primary);outline:none;min-width:200px}
.crm-filter-input:focus{border-color:var(--blue-500)}
.crm-filter-select{padding:7px 12px;border:1px solid var(--border-color);border-radius:8px;font-size:.85rem;background:var(--bg-card);color:var(--text-primary);cursor:pointer}
/* ── Search Autocomplete ── */
.search-autocomplete{position:relative}
.search-autocomplete input{width:100%;padding:10px 14px;border:1px solid var(--border-color);border-radius:8px;font-size:.95rem;background:var(--bg-card);color:var(--text-primary);outline:none}
.search-autocomplete input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.sa-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:200px;overflow-y:auto;z-index:100}
.sa-option{padding:10px 14px;cursor:pointer;font-size:.9rem;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
.sa-option:last-child{border-bottom:none}
.sa-option:hover,.sa-option.highlighted{background:var(--table-hover)}
.sa-option .sa-sub{font-size:.75rem;color:var(--text-secondary)}
.company-detail-back{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--blue);font-weight:600;font-size:.9rem;margin-bottom:16px}
.company-detail-back:hover{text-decoration:underline}
.contact-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center}
.contact-card.primary{border-color:var(--blue-500);background:var(--blue-50)}
.contact-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0}
.contact-info{flex:1}
.contact-info .ci-name{font-weight:600;font-size:.9rem}
.contact-info .ci-role{font-size:.8rem;color:var(--text-secondary)}
.contact-info .ci-detail{font-size:.8rem;color:var(--text-secondary);margin-top:4px}

/* ── Org Chart ── */
.org-chart{display:flex;flex-direction:column;align-items:center;padding:20px;gap:0}
.org-node{background:var(--bg-card);border:2px solid var(--border-color);border-radius:10px;padding:12px 20px;text-align:center;min-width:140px;position:relative}
.org-node.director{border-color:var(--blue);background:var(--blue-50)}
.org-node .on-name{font-weight:700;font-size:.85rem}
.org-node .on-role{font-size:.75rem;color:var(--text-secondary)}
.org-connector{width:2px;height:24px;background:var(--border-color);margin:0 auto}
.org-h-line{height:2px;background:var(--border-color)}
.org-row{display:flex;gap:24px;justify-content:center;position:relative}
.org-branch{display:flex;flex-direction:column;align-items:center}
.org-branch .org-connector{height:20px}

/* ── Comms Inbox ── */
.inbox-layout{display:flex;gap:0;height:calc(100vh - 160px);border:1px solid var(--border-color);border-radius:12px;overflow:hidden;background:var(--bg-card)}
.inbox-channels{width:180px;border-right:1px solid var(--border-color);padding:12px;flex-shrink:0;background:var(--bg-main)}
.inbox-channel{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;margin-bottom:4px;color:var(--text-primary);transition:all .1s}
.inbox-channel:hover{background:var(--bg-card)}
.inbox-channel.active{background:var(--blue);color:#fff;font-weight:600}
.inbox-channel .ch-badge{margin-left:auto;background:var(--red);color:#fff;font-size:.65rem;padding:1px 6px;border-radius:999px;font-weight:700}
.inbox-list{width:320px;border-right:1px solid var(--border-color);overflow-y:auto;flex-shrink:0}
.inbox-list-header{padding:14px 16px;border-bottom:1px solid var(--border-color);font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.inbox-item{padding:14px 16px;border-bottom:1px solid var(--border-color);cursor:pointer;transition:background .1s}
.inbox-item:hover{background:var(--table-hover)}
.inbox-item.active{background:var(--blue-50);border-left:3px solid var(--blue)}
.inbox-item.unread .ii-subject{font-weight:700}
.inbox-item .ii-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.inbox-item .ii-sender{font-weight:600;font-size:.85rem}
.inbox-item .ii-time{font-size:.7rem;color:var(--text-secondary)}
.inbox-item .ii-subject{font-size:.85rem;margin-bottom:2px}
.inbox-item .ii-preview{font-size:.8rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-item .ii-meta{display:flex;gap:6px;margin-top:6px}
.inbox-thread{flex:1;display:flex;flex-direction:column;overflow:hidden}
.inbox-thread-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center}
.inbox-thread-header h3{font-size:1rem;font-weight:700}
.inbox-messages{flex:1;overflow-y:auto;padding:20px}
.msg-bubble{max-width:75%;margin-bottom:16px;display:flex;flex-direction:column}
.msg-bubble.sent{align-self:flex-end;align-items:flex-end}
.msg-bubble.received{align-self:flex-start;align-items:flex-start}
.msg-bubble .msg-content{padding:12px 16px;border-radius:12px;font-size:.9rem;line-height:1.5}
.msg-bubble.sent .msg-content{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg-bubble.received .msg-content{background:var(--gray-100);color:var(--text-primary);border-bottom-left-radius:4px}
.msg-bubble .msg-meta{font-size:.7rem;color:var(--text-secondary);margin-top:4px;display:flex;gap:8px}
.inbox-compose{padding:16px 20px;border-top:1px solid var(--border-color);display:flex;gap:8px;align-items:flex-end}
.inbox-compose textarea{flex:1;padding:10px 14px;border:1px solid var(--border-color);border-radius:8px;font-size:.85rem;resize:none;min-height:40px;max-height:100px;font-family:inherit;background:var(--bg-card);color:var(--text-primary)}
.inbox-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}

/* ── Quick Actions ── */
.quick-actions{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.quick-action{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:14px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;flex:1;min-width:160px}
.quick-action:hover{border-color:var(--blue-500);background:var(--blue-50)}
.quick-action .qa-icon{font-size:1.3rem}
.quick-action .qa-text{font-weight:600;font-size:.85rem}

/* ── Activity Feed ── */
.activity-feed{padding:16px 20px}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-color);align-items:flex-start}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
